<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testowa strona Jasia</title>
<style>
  body{margin:0;height:100vh;overflow:hidden;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#ffecd2,#fcb69f);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
  h1{font-size:3rem;margin:0 0 .5rem;color:#5a2a27}
  p{color:#7a3e3a;font-size:1.2rem}
  #cat{font-size:5rem;position:absolute;transition:transform .2s}
  .emoji{position:absolute;font-size:2.5rem;pointer-events:none;animation:fly 1.6s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(720deg) scale(.2);opacity:0}}
  #score{position:absolute;top:1rem;right:1.5rem;font-size:1.3rem;color:#5a2a27}
</style>
</head>
<body>
<div id="score">Złapane: 0</div>
<h1>Cześć! 👋</h1>
<p>Spróbuj złapać kota. Powodzenia 😼<br>Kliknij gdziekolwiek, żeby odpalić konfetti z emoji.</p>
<div id="cat">🐱</div>
<script>
const cat=document.getElementById('cat'),score=document.getElementById('score');
let caught=0,x=innerWidth/2,y=innerHeight*0.75;
const place=()=>{cat.style.left=x+'px';cat.style.top=y+'px'};place();
document.addEventListener('mousemove',e=>{
  const dx=x-e.clientX,dy=y-e.clientY,d=Math.hypot(dx,dy);
  if(d<140){x+=dx/d*90;y+=dy/d*90;
    if(x<20||x>innerWidth-100)x=Math.random()*(innerWidth-120)+20;
    if(y<20||y>innerHeight-100)y=Math.random()*(innerHeight-120)+20;
    cat.style.transform='rotate('+(Math.random()*60-30)+'deg) scale(1.2)';place();
    setTimeout(()=>cat.style.transform='',200);}
});
cat.addEventListener('click',e=>{e.stopPropagation();caught++;score.textContent='Złapane: '+caught;cat.textContent=['🙀','😹','😻','😾'][caught%4];burst(e.clientX,e.clientY,30)});
const em=['🎉','🐟','🍕','🦄','💥','🌮','🐸','⭐'];
function burst(cx,cy,n){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='emoji';s.textContent=em[Math.random()*em.length|0];s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*Math.PI*2,r=150+Math.random()*250;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1700);}}
document.addEventListener('click',e=>burst(e.clientX,e.clientY,15));
</script>
</body>
</html>
